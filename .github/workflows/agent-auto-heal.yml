name: Agent Auto-Heal Pipeline

# DISABLED — Security: This workflow previously granted contents:write and passed
# production secrets (GEMINI_API_KEY, OPENROUTER_API_KEY, GITHUB_TOKEN) to an
# autonomous LLM agent that could write code and auto-push to any branch without
# human review. That violates supply-chain security (CWE-829, CWE-284).
#
# The workflow is replaced by a read-only no-op stub. To fix failing tests,
# create a PR with the fix and let the standard deploy CI run.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_run:
    workflows: ["Monorepo CI and Frontend Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to auto-heal"
        required: false
        default: "master"

# Read-only permissions only — no write access
permissions:
  contents: read

concurrency:
  group: auto-heal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled:
    name: Auto-Heal Disabled (Security)
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "Agent auto-heal workflow is disabled for security reasons."
          echo "Autonomous LLM code repair with write permissions is not permitted."
          echo "To fix failing tests, open a PR with the targeted fix for human review."
