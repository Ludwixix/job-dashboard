name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: job-dashboard-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: job-dashboard-react

      - name: Copy scraped jobs into public/
        run: |
          mkdir -p job-dashboard-react/public
          if [ -f job-dashboard-site/scrapers/jobs_combined.json ]; then
            cp job-dashboard-site/scrapers/jobs_combined.json job-dashboard-react/public/jobs_combined.json
            echo "Copied jobs_combined.json ($(wc -c < job-dashboard-site/scrapers/jobs_combined.json) bytes)"
          else
            echo '{"jobs":[],"count":0}' > job-dashboard-react/public/jobs_combined.json
            echo "Warning: jobs_combined.json not found, using empty fallback"
          fi

      - name: Build
        run: npm run build
        working-directory: job-dashboard-react
        env:
          GITHUB_PAGES: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: job-dashboard-react/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
