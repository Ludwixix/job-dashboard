global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'job-dashboard'
    static_configs:
      - targets: ['job-dashboard:8787']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "alert_rules.yml"

# Enable remote write for long-term storage (optional)
remote_write:
  - url: "http://remote-write-prometheus/api/v1/write"

# Enable remote read for query federation (optional)
remote_read:
  - url: "http://remote-read-prometheus/api/v1/read"