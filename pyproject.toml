[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-dashboard-core"
version = "0.1.0"
description = "Modular job discovery, classification, scoring, and application tracking core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
documents = ["pypdf>=5.0"]
scraping = ["python-jobspy>=1.1.0", "playwright>=1.40.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
