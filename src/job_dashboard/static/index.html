  <style>
    :root{--ink:#163c36;--muted:#52736b;--paper:#eef7f5;--panel:#fff;--mint:#d9efeb;--orange:#f45b2a;--line:#c8dfda;--blue:#276f78;--deep:#0d3f45}

    .preview{background:#0f181e;border-color:#397178;border-top-color:#ff7048;box-shadow:0 18px 45px rgba(0,0,0,.4)}.preview-header{background:linear-gradient(135deg,#111f25,#0d171d);border-bottom-color:#263942}.preview-header h2,.preview-fact strong,.preview-body h3,.preview-skills strong{color:#f1fbf8}.preview-company{color:#65e6d7}.preview-meta,.preview-empty{color:#9bb4b1}.preview-facts,.preview-actions{background:#0f181e;border-color:#263942}.preview-fact{border-color:#263942}.preview-fact span{color:#789895}.preview-actions a{background:#65e6d7;color:#071519}.preview-body{color:#c6d8d5}.preview-fit{background:#173b3c;color:#bffcf5;border-left-color:#ff7048}.preview-skills{border-top-color:#263942}.modal-listing{background:#173b3c;color:#eef8f6}

  <style>

    main{max-width:1480px;padding:28px}.controls{grid-template-columns:minmax(390px,2fr) 1fr 1fr 170px;gap:14px;padding:18px}.summary{padding:16px 0}.workspace{grid-template-columns:210px minmax(380px,.72fr) minmax(0,1.65fr);gap:18px}.sidebar{padding:20px 14px;background:#102126;border-color:#2b4d53}.side-group{padding-bottom:22px}.side-group button{padding:11px 10px;color:#b5caca}.highlight-job{padding:11px!important}.job-card{min-height:205px;margin-bottom:14px;padding:22px;background:#121c23;border-color:#29404a;box-shadow:0 8px 24px rgba(0,0,0,.24)}.job-card .card-head h2{font-size:19px}.job-card:hover,.job-card.is-selected{box-shadow:0 0 0 1px rgba(123,224,211,.3),0 14px 34px rgba(0,0,0,.35)}.description{line-height:1.6}.preview{top:20px;min-height:calc(100vh - 150px);max-height:calc(100vh - 150px);border-color:#4c8d91;box-shadow:0 18px 45px rgba(0,0,0,.42)}.preview-header{padding:36px 38px 28px}.preview-header h2{font-size:clamp(30px,3vw,44px)}.preview-fact{padding:15px 38px}.preview-actions{padding:17px 38px}.preview-body{padding:30px 38px;font-size:16px;line-height:1.85}.preview-body>p:not(.preview-fit){max-width:78ch}.preview-skills{margin-top:30px;padding-top:22px}.listing{background:#7bd8cc;color:#092025}.score{color:#7bd8cc}.source{background:#18373b;color:#bdebe5}.tags span{background:#1a3035;color:#bdebe5}@media(max-width:1100px){.workspace{grid-template-columns:180px minmax(330px,.8fr) minmax(0,1.3fr)}main{padding:22px}}@media(max-width:820px){.workspace{grid-template-columns:1fr}.preview-body{padding:24px}.preview-header{padding:26px}.preview-fact{padding:13px 26px}.preview-actions{padding:14px 26px}}

  <style>

<body>
  <header class="topbar"><div><p class="eyebrow">LOCAL WORKSPACE</p><h1>Job Desk</h1></div><div class="top-actions"><button id="theme-toggle" aria-label="Switch color theme">Night mode</button></div></header>
  <main>
    <section class="controls"><label>Search <input id="search" placeholder="title, company, skill"></label><label>Stream <select id="stream"><option value="">All streams</option><option value="core-it">Core IT</option><option value="bridge">Bridge work</option><option value="traineeship">Traineeships</option></select></label><label>Source <select id="source"><option value="">All sources</option><option>Indeed</option><option>Seek</option><option>LinkedIn</option><option>Adzuna</option><option>RemoteOK</option></select></label><label>Minimum score <input id="minimum" type="number" min="0" max="100" value="0"></label><label>Order <select id="sort"><option value="score">Best match</option><option value="newest">Newest</option><option value="title">Title</option><option value="company">Company</option></select></label></section>
    <section class="summary"><strong id="count">0 jobs</strong><span id="status">Loading saved jobs</span></section>
    <section class="workspace"><aside id="sidebar" class="sidebar"><div class="side-group"><h2>Categories</h2><button data-stream="">All active jobs <span class="category-count" data-count="all">0</span></button><button data-stream="core-it">Core IT <span class="category-count" data-count="core-it">0</span></button><button data-stream="bridge">Bridge work <span class="category-count" data-count="bridge">0</span></button><button data-stream="traineeship">Traineeships <span class="category-count" data-count="traineeship">0</span></button></div><div class="side-group"><h2>Refine</h2><button data-source="Adzuna">Adzuna <span class="category-count" data-count="Adzuna">0</span></button><button data-source="Seek">Seek <span class="category-count" data-count="Seek">0</span></button><button data-source="Indeed">Indeed <span class="category-count" data-count="Indeed">0</span></button><button data-minimum="70">70%+ match <span class="category-count" data-count="70">0</span></button></div><div class="side-group highlighted"><h2>Highlighted</h2><div id="highlights"><p class="side-empty">Loading highlights</p></div></div></aside><section id="jobs" class="jobs"></section><aside id="preview" class="preview" aria-live="polite"><p class="preview-empty">Select a job to view the full listing</p></aside></section>
  </main>
    <dialog id="job-modal" class="job-modal"><button class="modal-close" aria-label="Close job details">Close</button><div class="modal-kicker"></div><h2 class="modal-title"></h2><p class="modal-company"></p><div class="modal-meta"></div><div class="modal-grid"><section><h3>About the role</h3><div class="modal-description"></div></section><aside><h3>Fit analysis</h3><div class="modal-score"></div><div class="modal-fit"></div><div class="modal-skills"></div></aside></div><div class="modal-actions"><a class="modal-listing" target="_blank" rel="noreferrer">Open original listing</a><button class="modal-generate">Generate CV + letter</button></div></dialog>
  <template id="card"><article class="job-card"><div class="card-head"><div><span class="source"></span><h2></h2><p class="company"></p></div><strong class="score"></strong></div><div class="listing-meta"><span class="meta"></span><span class="salary"></span></div><p class="description"></p><div class="tags"></div><div class="details"><span class="fit"></span><span class="matched"></span></div><label>Stage <select class="status"><option value="sourced">Sourced</option><option value="shortlisted">Shortlisted</option><option value="applied">Applied</option><option value="interviewing">Interviewing</option><option value="offer">Offer</option><option value="rejected">Rejected</option></select></label><div class="actions"><a class="listing" target="_blank" rel="noreferrer">Open listing</a><a class="email-link" target="_blank" rel="noreferrer" hidden>View email</a><button class="generate">Generate CV + letter</button></div><div class="generated"></div></article></template>
  <script src="/app.js?v=20260825-layout"></script>
